[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idash"
version = "0.1.0"
description = "Monitor de indicadores econômicos com coleta agendada, alertas, dashboard e resumo por IA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pandas>=2.1", "requests>=2.31", "python-dotenv>=1.0", "google-genai>=1.0"]

[project.optional-dependencies]
ui = ["streamlit>=1.51", "altair>=5"]
dev = ["pytest>=8"]

[project.scripts]
idash = "idash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idash = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
